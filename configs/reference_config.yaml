# QACD 参考配置
#
# 这是平台对接所使用的默认配置。字段含义见 docs/02-接口文档.md。
# 注意：本文件不包含拟合后的系数。冻结打分器需要从开发集用 `qacd fit` 重新拟合，
# 或由研究流水线导出（见 results/README.md）。

version: "1.0.0"

# 每条回答最多分解出的主张数（实现上限，非调优超参）
max_claims: 8

# BIC-lite 校准器的 L2 系数（冻结值）
l2: 0.05

# 告警阈值。0.5 是自然概率切点，仅用于展示；
# 研究流水线评估的是排序（AUROC/AUPRC）与概率质量（Brier/NLL），不调阈值。
threshold: 0.5

# MVR 重采样深度：null 表示关闭；3 是性价比拐点；5 是实测最佳。
k: 3

# 响应对齐头的 L2 系数（研究流水线用 sklearn LogisticRegression(C=1.0)）
fusion_l2: 0.02

# 主张级校准器消费的特征顺序（不得随意改动，否则冻结系数失效）
# 完整清单见 qacd/features.py 的 REFERENCE_FEATURE_NAMES
feature_families:
  - belief        # 信念一致性视图（4 视图汇总）
  - direct        # 类型化直接验证
  - alignment     # 证据-主张对齐
  - interaction   # 交叉项
  - mechanical    # 机械 OCR 仪器通道（19 维 OCR 子族）

# 研究流水线完整通道规模，供对照
research_reference:
  lm_channel_features: 95
  mechanical_family_features: 28
  frozen_reference_auroc: 0.8526
  frozen_reference_brier: 0.1529
  note: "LM 95 维 + 机械 28 维 + MVR 7 维，图像级配对 bootstrap 5000 次"
